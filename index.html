    <script>
        $(document).ready(function() {
            // Load channels from external JSON file
            $.getJSON('channels.json', function(data) {
                loadChannels(data);
            });

            // Function to load channels
            function loadChannels(data) {
                const channelList = $('#channel-list');
                channelList.empty();

                // Load all channels by default
                for (const type in data) {
                    data[type].forEach(channel => {
                        const channelItem = `
                            <li class="${type}">
                                <a id="myLink" onclick="view.location.href='${channel.url}'" class='channel flex-item'>
                                    <img src="${channel.logo}" alt="${channel.name}">
                                </a>
                            </li>
                        `;
                        channelList.append(channelItem);
                    });
                }

                // Tab click event to filter channels
                $('.nav-link').on('click', function() {
                    const type = $(this).data('type');
                    $('.nav-link').removeClass('active');
                    $(this).addClass('active');

                    channelList.empty();
                    data[type].forEach(channel => {
                        const channelItem = `
                            <li class="${type}">
                                <a id="myLink" onclick="view.location.href='${channel.url}'" class='channel flex-item'>
                                    <img src="${channel.logo}" alt="${channel.name}">
                                </a>
                            </li>
                        `;
                        channelList.append(channelItem);
                    });
                });
            }
        });
    </script>

<script>
const adLink = "https://landslidegraphsystems.com/cb9qybx5q?key=6507258c1d9590f2b577229ef7249b58";

let popupCount = 0;
let maxPopups = 10;

// ===== RANDOM FIRST DELAY =====
function getRandomFirstDelay(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

// ===== SAFE NEXT DELAY (5–60 min) =====
function getNextDelay() {
    const MIN_GAP = 5 * 60 * 1000;   // 5 min
    const MAX_GAP = 60 * 60 * 1000;  // 60 min

    let delay = Math.floor(Math.random() * (MAX_GAP - MIN_GAP + 1)) + MIN_GAP;

    // small jitter (0–30 sec)
    let jitter = Math.floor(Math.random() * 30000);

    delay = Math.random() > 0.5 ? delay + jitter : delay - jitter;

    // NEVER go below 5 minutes
    return Math.max(MIN_GAP, delay);
}

// ===== SHOW POPUP =====
function showFredflixModal() {

    // ✅ NEW SAFETY: tab hidden check
    if (document.hidden) return;

    if (popupCount >= maxPopups) return;

    const overlay = document.getElementById("fredflix-modal-overlay");
    const closeBtn = document.getElementById("fredflix-close-btn");
    const countdownEl = document.getElementById("fredflix-countdown");

    overlay.style.display = "flex";
    popupCount++;

    // countdown 5-15 sec random
    let timeLeft = Math.floor(Math.random() * 11) + 5;
    closeBtn.style.display = "none";
    countdownEl.style.display = "block";
    countdownEl.textContent = `${timeLeft}s`;

    let timer = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
            countdownEl.textContent = `${timeLeft}s`;
        } else {
            clearInterval(timer);
            countdownEl.style.display = "none";
            closeBtn.style.display = "block";
        }
    }, 1000);
}

// ===== OPEN AD + NEXT =====
function hideFredflixModalAndOpenAd() {
    window.open(adLink, "_blank");
    document.getElementById("fredflix-modal-overlay").style.display = "none";
    scheduleNextPopup();
}

// ===== CLOSE ONLY =====
function hideFredflixModalOnly() {
    document.getElementById("fredflix-modal-overlay").style.display = "none";
    scheduleNextPopup();
}

// ===== NEXT POPUP SCHEDULER =====
function scheduleNextPopup() {
    if (popupCount >= maxPopups) return;

    const nextDelay = getNextDelay();

    setTimeout(() => {
        showFredflixModal();
    }, nextDelay);
}

// ===== INIT =====
document.addEventListener("DOMContentLoaded", function () {

    // First popup 5–9 sec random
    const firstDelay = getRandomFirstDelay(5000, 9000);
    setTimeout(showFredflixModal, firstDelay);

    document.body.insertAdjacentHTML("beforeend", `
    <div id="fredflix-modal-overlay" style="display:none;">
        <div id="fredflix-modal" style="background:#fff;padding:20px;max-width:400px;margin:auto;border-radius:10px;position:relative;">
            
            <span id="fredflix-countdown" style="font-size:18px;font-weight:bold;"></span>
            <span id="fredflix-close-btn" style="display:none;position:absolute;top:10px;right:10px;cursor:pointer;">✖</span>

            <h2>Support Our Service</h2>

            <p>We keep this service free by showing occasional ads. Your support helps us continue.</p>
            <p>মাঝে মাঝে বিজ্ঞাপন দেখিয়ে আমরা এই পরিষেবাটি বিনামূল্যে রাখি।</p>

            <iframe src="${adLink}" loading="lazy" style="width:100%;height:80px;border:0;"></iframe>

            <button id="fredflix-continue-btn" style="margin-top:10px;padding:10px;width:100%;">
                Continue
            </button>
        </div>
    </div>
    `);

    document.getElementById("fredflix-continue-btn")
        .addEventListener("click", hideFredflixModalAndOpenAd);

    document.getElementById("fredflix-close-btn")
        .addEventListener("click", hideFredflixModalOnly);
});
</script>
